    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="assets/js/language-manager.js"></script>
    <script src="assets/js/footer-manager.js"></script>
    <script src="assets/js/map.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize Language Manager and Footer
            fetch('assets/data/audioguide.json')
                .then(response => response.json())
                .then(data => {
                    // Initialize language manager
                    if (window.LanguageManager) {
                        window.LanguageManager.initialize(data);
                    }
                    
                    // Initialize footer
                    if (window.FooterManager) {
                        window.FooterManager.init();
                    }
                })
                .catch(error => {
                    console.error('Error loading audioguide data:', error);
                    // Initialize footer even if data loading fails
                    if (window.FooterManager) {
                        window.FooterManager.init();
                    }
                });

            // Mobile menu functionality
            const mobileMenuButton = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            const menuIcon = mobileMenuButton.querySelector('.menu-icon');

            if (mobileMenuButton && mobileMenu) {
                mobileMenuButton.addEventListener('click', function() {
                    const isExpanded = mobileMenuButton.getAttribute('aria-expanded') === 'true';
                    
                    mobileMenuButton.setAttribute('aria-expanded', !isExpanded);
                    mobileMenu.setAttribute('aria-hidden', isExpanded);
                    
                    if (isExpanded) {
                        mobileMenu.classList.remove('open');
                        menuIcon.classList.remove('fa-times');
                        menuIcon.classList.add('fa-bars');
                    } else {
                        mobileMenu.classList.add('open');
                        menuIcon.classList.remove('fa-bars');
                        menuIcon.classList.add('fa-times');
                    }
                });

                // Close mobile menu when clicking outside
                document.addEventListener('click', function(event) {
                    if (!mobileMenuButton.contains(event.target) && !mobileMenu.contains(event.target)) {
                        mobileMenu.classList.remove('open');
                        mobileMenuButton.setAttribute('aria-expanded', 'false');
                        mobileMenu.setAttribute('aria-hidden', 'true');
                        menuIcon.classList.remove('fa-times');
                        menuIcon.classList.add('fa-bars');
                    }
                });
            }
        });
    </script>
